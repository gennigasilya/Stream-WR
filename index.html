<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer Schedule &amp; Budget Manager</title>
<style>
:root {
  --bg: #faf6f0;
  --panel: #ffffff;
  --panel-2: #f4ece0;
  --border: #e4d6c3;
  --text: #3a2b1e;
  --text-dim: #8a7561;
  --accent: #8b5e3c;
  --accent-2: #6f4a2e;
  --danger: #c0392b;
  --warning: #b8860b;
  --success: #2f7d4f;
  --radius: 10px;
  font-family: -apple-system, "Segoe UI", "Noto Sans Thai", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 3px rgba(139, 94, 60, 0.08);
  position: sticky;
  top: 0;
  z-index: 20;
}

header.topbar h1 {
  font-size: 18px;
  margin: 0;
  font-weight: 700;
}

nav.tabs {
  display: flex;
  gap: 6px;
}

nav.tabs a {
  color: var(--text-dim);
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s, color 0.15s;
}
nav.tabs a:hover { background: var(--panel-2); color: var(--text); }
nav.tabs a.active { background: var(--accent); color: white; }

main {
  padding: 20px 24px 60px;
  max-width: 1200px;
  margin: 0 auto;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 1px 2px rgba(139, 94, 60, 0.05);
}

.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }

button, .btn {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}
button:hover, .btn:hover { background: var(--accent-2); }
button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
button.secondary:hover { background: #262b34; }
button.danger { background: var(--danger); }
button.small { padding: 5px 10px; font-size: 12px; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

input, select, textarea {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 13px;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
.field { display: flex; flex-direction: column; gap: 2px; }

h2 { font-size: 16px; margin: 0 0 12px; }
h3 { font-size: 14px; margin: 0 0 8px; }

/* ---------- Calendar ---------- */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-title { font-size: 18px; font-weight: 700; }
.view-toggle { display: flex; gap: 4px; background: var(--panel-2); padding: 3px; border-radius: 8px; }
.view-toggle button { background: transparent; color: var(--text-dim); padding: 6px 12px; }
.view-toggle button.active { background: var(--accent); color: white; }

.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 12px; color: var(--text-dim); }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.legend .status-swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -2px; }

.game-filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.game-filter-chip {
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.game-filter-chip[data-game-filter=""] { color: var(--text-dim); border-color: var(--border); }
.game-filter-chip[data-game-filter=""].active { background: var(--accent); border-color: var(--accent); color: white; }

.live-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.live-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.live-card:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(139, 94, 60, 0.14); }
.live-card.is-offline { opacity: 0.6; }
.live-card-avatar-wrap { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
.live-card-avatar-wrap .avatar-circle { width: 100%; height: 100%; font-size: 26px; border: 3px solid var(--border); }
.live-card.is-live .live-card-avatar-wrap .avatar-circle { border-color: var(--danger); }
.live-pulse-dot {
  position: absolute; top: 2px; right: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--danger); border: 2px solid var(--panel);
  animation: live-pulse 1.6s infinite;
}
.live-dot-inline {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger); animation: live-pulse 1.6s infinite;
}
@keyframes live-pulse {
  0% { box-shadow: 0 0 0 0 rgba(192,57,43,0.5); }
  70% { box-shadow: 0 0 0 7px rgba(192,57,43,0); }
  100% { box-shadow: 0 0 0 0 rgba(192,57,43,0); }
}
.live-game-badge {
  position: absolute; bottom: -2px; right: -2px;
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800; color: white;
  border: 2px solid var(--panel);
}
.live-card-name { font-weight: 700; font-size: 14px; text-align: center; color: var(--text); }
.live-card-status { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.live-card-status.is-live { color: var(--danger); }
.live-card-status.is-offline { color: var(--text-dim); font-weight: 400; text-align: center; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--text-dim); padding-bottom: 4px; font-weight: 600; }
.cal-cell {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-height: 92px;
  padding: 6px;
  cursor: pointer;
  transition: border-color 0.15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.cal-cell:hover { border-color: var(--accent); }
.cal-cell.empty { background: transparent; border: none; cursor: default; }
.cal-cell.status-no_live { border-color: var(--danger); background: rgba(239,68,68,0.08); }
.cal-cell .date-num { font-size: 12px; font-weight: 700; color: var(--text-dim); }
.cal-cell.today { border: 2px solid var(--accent-2); background: rgba(111,74,46,0.1); }
.cal-cell.today .date-num { color: var(--accent-2); font-weight: 800; }
.cal-cell .badges { display: flex; flex-wrap: wrap; gap: 3px; }
.cal-cell .cal-names { display: flex; flex-direction: column; gap: 2px; }
.cal-cell .cal-name-item { font-size: 11px; color: var(--text); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-cell .cal-name-item.tournament { color: var(--warning); font-weight: 700; }
.cal-cell .cal-name-empty { font-size: 11px; color: var(--text-dim); }
.game-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  color: white;
  font-weight: 700;
  white-space: nowrap;
}
.status-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
.status-tag.no_live { color: var(--danger); }
.status-tag.tournament { color: var(--warning); }

.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: start; }
.week-col { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; cursor: pointer; min-height: 100px; transition: border-color 0.15s; }
.week-col:hover { border-color: var(--accent); }
.week-col.status-no_live { border-color: var(--danger); background: rgba(192,57,43,0.06); }
.week-col.today { border: 2px solid var(--accent-2); background: rgba(111,74,46,0.08); }
.week-col.today .week-col-header { color: var(--accent-2); font-weight: 800; }
.week-col-header { display: flex; flex-direction: column; gap: 2px; font-weight: 700; font-size: 13px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.week-event {
  background: var(--panel);
  border-left: 4px solid var(--accent);
  border-radius: 4px;
  padding: 6px 8px;
  margin-bottom: 6px;
  font-size: 12px;
}
.week-event .we-time { color: var(--text-dim); font-size: 10px; }
.week-event .we-game { font-weight: 700; font-size: 12px; margin-top: 1px; }
.week-event .we-streamer { font-weight: 600; color: var(--text); margin-top: 2px; }
.week-event .we-tournament-tag { font-size: 10px; color: var(--warning); font-weight: 700; margin-top: 3px; }


/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto; z-index: 100;
}
.modal {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; width: 100%; max-width: 560px;
}
.modal-close { background: transparent; color: var(--text-dim); font-size: 18px; padding: 4px 8px; }
.modal-close:hover { background: var(--panel-2); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-weight: 600; font-size: 12px; }
tr:last-child td { border-bottom: none; }

.session-row {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.session-row:last-child { border-bottom: none; }
.session-row.is-tournament { background: rgba(184,134,11,0.06); }
.session-row-main {
  display: grid;
  grid-template-columns: 74px 76px 26px minmax(0, 1fr) 28px 64px;
  align-items: center;
  gap: 8px;
}
.session-row .time { color: var(--text-dim); font-size: 12px; }
.session-row .streamer-link { color: var(--text); font-weight: 600; text-decoration: none; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-row .streamer-link:hover { color: var(--accent); }
.session-row-sub {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--text-dim);
  padding-left: 208px;
  margin-top: 2px;
}
.session-row .price { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-dim); font-size: 12px; }
.session-row .price.free { color: var(--warning); font-weight: 700; }

.tour-icon-toggle {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  opacity: 0.45;
  font-size: 13px;
  line-height: 1;
  padding: 0;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.tour-icon-toggle:hover { opacity: 1; border-color: var(--warning); }
.tour-icon-toggle.active { opacity: 1; background: var(--warning); border-color: var(--warning); color: white; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; color: white; }

.brief-box-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.brief-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; border-top: 3px solid var(--border); }
.brief-box .brief-game-name { font-weight: 700; font-size: 14px; margin-bottom: 8px; }
.brief-box .brief-text { font-size: 13px; color: var(--text); white-space: pre-wrap; line-height: 1.5; word-break: break-word; }
.brief-box .brief-text a { color: var(--accent); text-decoration: underline; }
.brief-box .brief-dates { font-size: 11px; color: var(--text-dim); margin-top: 8px; font-weight: 600; }
.brief-box .brief-empty { font-size: 12px; color: var(--text-dim); font-style: italic; }
.brief-row { border-top: 1px solid var(--border); padding: 14px 0; }
.brief-row textarea { width: 100%; min-height: 60px; font-family: inherit; padding: 8px; border: 1px solid var(--border); border-radius: 8px; resize: vertical; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat-tile { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.stat-tile .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
.stat-tile .value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat-tile.savings .value { color: var(--success); }

.streamer-detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.avatar-circle { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; overflow: hidden; flex-shrink: 0; }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.avatar-circle.large { width: 72px; height: 72px; font-size: 24px; }
.avatar-circle.tiny { width: 26px; height: 26px; font-size: 11px; }

.photo-upload-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.photo-upload-row .field { flex: 1; }
.photo-upload-row input[type="file"] { font-size: 12px; }

tr.editor-row td { padding: 0; }
.editor-card { margin: 0; border-radius: 0; border-left: none; border-right: none; border-top: 2px solid var(--accent); background: var(--panel-2); }

.avail-day-row { display: flex; gap: 6px; flex-wrap: wrap; }
.avail-day-chip { background: rgba(192,57,43,0.08); border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
.avail-day-chip.active { background: var(--success); border-color: var(--success); color: white; }

.empty-state { text-align: center; color: var(--text-dim); padding: 30px; font-size: 13px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 200; }

.month-select { display: flex; align-items: center; gap: 8px; }

details.game-summary { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; padding: 10px 14px; }
details.game-summary summary { cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 8px; list-style: none; }
details.game-summary summary::-webkit-details-marker { display: none; }
details.game-summary .gs-totals { margin-left: auto; display: flex; gap: 16px; font-size: 12px; color: var(--text-dim); font-weight: 400; }

.admin-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.admin-tabs button { background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border); }
.admin-tabs button.active { background: var(--accent); color: white; border-color: var(--accent); }

.color-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,0.2); }

@media (max-width: 700px) {
  header.topbar { flex-direction: column; align-items: flex-start; gap: 10px; }
  .cal-grid { gap: 2px; }
  .cal-cell { min-height: 44px; min-width: 0; padding: 2px; gap: 2px; }
  .cal-cell .date-num { font-size: 10px; }
  .cal-dow { font-size: 9px; padding-bottom: 2px; }
  /* Per-game count pills ("TOSM 3") don't fit 7 narrow columns — collapse to plain color
     dots (which game had streams that day); tap the day for the exact breakdown. */
  .cal-cell .badges { gap: 2px; }
  .game-badge { width: 9px; height: 9px; min-width: 9px; padding: 0; border-radius: 50%; font-size: 0; overflow: hidden; }
  .cal-cell .cal-name-item { font-size: 9px; }
  main { padding: 14px; }
  .week-grid { grid-template-columns: repeat(7, 130px); overflow-x: auto; padding-bottom: 8px; }
}

</style>
</head>

<main id="app"></main>

const Util = (() => {
  function fmtMoney(n) {
    return Number(n || 0).toLocaleString("th-TH", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function toISODate(y, m, d) { return `${y}-${pad2(m)}-${pad2(d)}`; }
  function parseISODate(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  const MONTH_NAMES_TH = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  const DOW_TH = ["อา","จ","อ","พ","พฤ","ศ","ส"];
  const TIME_SLOTS = [
    { key: "afternoon", label: "บ่าย" },
    { key: "evening", label: "เย็น" },
    { key: "night", label: "ดึก" },
  ];
  const AVAIL_DAYS = [
    { key: "mon", label: "จ" },
    { key: "tue", label: "อ" },
    { key: "wed", label: "พ" },
    { key: "thu", label: "พฤ" },
    { key: "fri", label: "ศ" },
    { key: "sat", label: "ส" },
    { key: "sun", label: "อา" },
  ];
  // Special value the "List Streamer" sheet's days column uses to mean "available every day".
  const EVERY_DAY_LABEL = "ทุกวัน";
  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  // Turns http(s):// URLs in already-escaped text into clickable links. Must run AFTER
  // escapeHtml (operates on the escaped string) so it never reintroduces raw HTML from the
  // source text.
  function linkify(escapedText) {
    return String(escapedText ?? "").replace(/(https?:\/\/[^\s<]+)/g, (url) => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  }
  // "Today" is always computed in Thailand time (Asia/Bangkok, UTC+7), regardless of the
  // viewer's own device timezone, so the highlighted date matches Thailand's clock.
  function todayISO() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit", day: "2-digit",
    }).formatToParts(new Date());
    const y = parts.find((p) => p.type === "year").value;
    const m = parts.find((p) => p.type === "month").value;
    const d = parts.find((p) => p.type === "day").value;
    return `${y}-${m}-${d}`;
  }
  // A photo failing to load once doesn't mean it's broken — flaky mobile connections (weak
  // signal, iOS Low Power Mode throttling background loads) can cause a transient failure that
  // would succeed a second later. Retry a couple of times (cache-busted, with backoff) before
  // giving up and falling back to initials.
  function handleAvatarImgError(img, initials) {
    const retries = Number(img.dataset.retries || "0");
    if (retries < 2) {
      img.dataset.retries = String(retries + 1);
      if (!img.dataset.baseSrc) img.dataset.baseSrc = img.src;
      const baseSrc = img.dataset.baseSrc;
      setTimeout(() => {
        img.src = baseSrc + (baseSrc.includes("?") ? "&" : "?") + "r=" + Date.now();
      }, 700 * (retries + 1));
    } else if (img.parentElement) {
      img.parentElement.textContent = initials;
    }
  }
  function avatarHTML(streamer, sizeClass) {
    const cls = "avatar-circle" + (sizeClass ? " " + sizeClass : "");
    const initials = streamer ? streamer.name.slice(0, 2).toUpperCase() : "?";
    if (streamer && streamer.photo) {
      return `<div class="${cls}"><img src="${streamer.photo}" alt="${escapeHtml(streamer.name)}" onerror="Util.handleAvatarImgError(this, '${escapeHtml(initials)}')"></div>`;
    }
    return `<div class="${cls}">${escapeHtml(initials)}</div>`;
  }
  function showToast(msg) {
    const root = document.getElementById("toast-root");
    root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
    setTimeout(() => { root.innerHTML = ""; }, 2200);
  }
  function openModal(html) {
    const root = document.getElementById("modal-root");
    root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal">${html}</div></div>`;
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") closeModal();
    });
  }
  function closeModal() {
    document.getElementById("modal-root").innerHTML = "";
  }
  return { fmtMoney, pad2, toISODate, parseISODate, MONTH_NAMES_TH, DOW_TH, TIME_SLOTS, AVAIL_DAYS, EVERY_DAY_LABEL, escapeHtml, linkify, todayISO, avatarHTML, handleAvatarImgError, showToast, openModal, closeModal };
})();

  // and availability. This is the source of truth for those fields when synced from Admin.
  const LIST_STREAMER_GID = 1783567342;
  // The "Brief" tab: one column per game, holding free-text promo notes for streamers.
  const BRIEF_GID = 2087813979;
  // The "ตาราง Set Up" tab: one row per OBS setup appointment (streamer, game, date, time, status).
  const SETUP_GID = 1774117405;
  function sheetCsvUrl(gid) {
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
  }
  let state = null;

  function splitCSVLine(line) {
    const result = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (inQuotes) {
        if (c === '"') {
          if (line[i + 1] === '"') { cur += '"'; i++; } else inQuotes = false;
        } else cur += c;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        result.push(cur);
        cur = "";
      } else {
        cur += c;
      }
    }
    result.push(cur);
    return result;
  }

  // Full-table CSV parser that (unlike splitCSVLine + naive line-splitting used elsewhere in
  // this file) correctly handles quoted cells containing literal embedded newlines — needed
  // for the Brief tab, whose promo-text cells are genuinely multi-line.
  function parseCSVTable(text) {
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;
    let i = 0;
    while (i < text.length) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { cur += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        cur += c; i++; continue;
      }
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ",") { row.push(cur); cur = ""; i++; continue; }
      if (c === "\r") { i++; continue; }
      if (c === "\n") { row.push(cur); cur = ""; rows.push(row); row = []; i++; continue; }
      cur += c; i++;
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  // Parses the "Brief" tab: one column per game (header row = game names), every non-empty
  // cell below it is a block of promo-text notes for that game. Blocks are joined with a blank
  // line between them. The literal "Timeline :" label cells carry no actual date and are skipped.
  function parseBriefCSV(csvText) {
    const rows = parseCSVTable(csvText);
    if (!rows.length) return {};
    const header = rows[0];
    const gameIdByCol = header.map((h) => mapListSheetGameId(h));
    const blocks = {};
    for (let r = 1; r < rows.length; r++) {
      (rows[r] || []).forEach((cell, col) => {
        const gameId = gameIdByCol[col];
        if (!gameId) return;
        const trimmed = (cell || "").trim();
        if (!trimmed || trimmed === "Timeline :") return;
        if (!blocks[gameId]) blocks[gameId] = [];
        blocks[gameId].push(trimmed);
      });
    }
    const result = {};
    Object.keys(blocks).forEach((gameId) => { result[gameId] = blocks[gameId].join("\n\n"); });
    return result;
  }

  // Pulls promo text into each game's brief.text from the sheet; startDate/endDate (set
  // manually in Admin, since the sheet has no usable date data) are left untouched.
  async function syncBriefsFromSheet() {
    const res = await fetch(sheetCsvUrl(BRIEF_GID));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const briefs = parseBriefCSV(text);
    let updated = 0;
    Object.keys(briefs).forEach((gameId) => {
      const g = getGame(gameId);
      if (!g) return;
      const existing = g.brief || { text: "", startDate: null, endDate: null };
      g.brief = { text: briefs[gameId], startDate: existing.startDate, endDate: existing.endDate };
      updated++;
    });
    save();
    return { updated };
  }

  // Parses the "ตาราง Set Up" tab: row 1 is a title ("SET UP OBS"), row 2 is the header
  // (Streamer, GAME, วันที่, เวลา, status). Game names and date formats here are whatever staff
  // typed by hand (not our 5-game enum, not a consistent date format), so both are kept as raw
  // text rather than mapped/parsed — this is a display/reference table, not schedule data.
  // Columns: Streamer, GAME, วันที่ (set date), เวลา, วันไลฟ์ (live date — added later by staff;
  // "FALSE" or blank means not filled in yet), status. Live date lets Set-vs-Live lead time be
  // checked directly against what staff actually confirmed, rather than guessed from schedule data.
  function parseSetupCSV(csvText) {
    const rows = parseCSVTable(csvText).slice(2);
    const records = [];
    rows.forEach((cols) => {
      const streamerName = (cols[0] || "").trim();
      if (!streamerName) return;
      const liveDateRaw = (cols[4] || "").trim();
      records.push({
        streamerName,
        game: (cols[1] || "").trim(),
        dateRaw: (cols[2] || "").trim(),
        time: (cols[3] || "").trim(),
        liveDateRaw: liveDateRaw.toUpperCase() === "FALSE" ? "" : liveDateRaw,
        done: (cols[5] || "").trim().toLowerCase() === "done",
      });
    });
    return records;
  }

  // Replaces the whole setup-queue table from the sheet (it's a flat historical log, not
  // date-scoped data to merge).
  async function syncSetupFromSheet() {
    const res = await fetch(sheetCsvUrl(SETUP_GID));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    state.setupRecords = parseSetupCSV(text);
    save();
    return { count: state.setupRecords.length };
  }

  function listSetupRecords() {
    return state.setupRecords || [];
  }

  // Distinct games a streamer already has a "Done" setup record for, by name (case-insensitive).
  function setupGamesForStreamer(name) {
    const key = (name || "").trim().toLowerCase();
    const games = new Set();
    listSetupRecords().forEach((r) => {
      if (r.done && r.streamerName.trim().toLowerCase() === key) games.add(r.game);
    });
    return Array.from(games);
  }

  function mapSheetGameId(raw) {
    const t = (raw || "").trim();
    if (/^TOSM$/.test(t)) return "tosm";
    if (/^Zone4/.test(t)) return "zone4";
    if (/^Cabal/.test(t)) return "cabal";
    if (/^TR$/.test(t)) return "tr";
    if (/^WARZ$/.test(t)) return "warz";
    return null;
  }

  // Game names in the "List Streamer" tab are typed loosely (case, spacing) so match case/space-insensitively.
  function mapListSheetGameId(raw) {
    const t = (raw || "").trim().toLowerCase().replace(/\s+/g, "");
    if (t === "tosm") return "tosm";
    if (t === "zone4") return "zone4";
    if (t === "cabal") return "cabal";
    if (t === "tr" || t.startsWith("tales")) return "tr";
    if (t === "warz") return "warz";
    return null;
  }

  // Parses the "List Streamer" tab: one row per streamer per game, columns are
  // name, game, normal price, discount price, up to 3 time-slot cells, then a days cell.
  // Time-slot/day cells hold the exact Thai labels from Util.TIME_SLOTS / Util.AVAIL_DAYS.
  // When a streamer has multiple game rows, Google Sheets merges the name cell visually —
  // only the first row's CSV cell has the name, the rest are blank — so the name is
  // forward-filled the same way the schedule tab's merged Date column is.
  function parseListStreamerCSV(csvText) {
    const lines = csvText.split(/\r\n|\n/).slice(1); // row1 is the header
    const rows = [];
    let currentName = null;
    lines.forEach((line) => {
      if (!line.trim()) return;
      const cols = splitCSVLine(line);
      const nameRaw = (cols[0] || "").trim();
      if (nameRaw) currentName = nameRaw;
      const name = currentName;
      if (!name) return;
      const gameId = mapListSheetGameId(cols[1]);
      if (!gameId) return;
      const normalPrice = Number((cols[2] || "").trim()) || 0;
      const discRaw = (cols[3] || "").trim();
      const discountPrice = discRaw === "" ? null : (Number(discRaw) || 0);
      const slotLabels = [cols[4], cols[5], cols[6]].map((c) => (c || "").trim()).filter(Boolean);
      const timeSlots = Util.TIME_SLOTS.filter((t) => slotLabels.includes(t.label)).map((t) => t.key);
      const daysRaw = (cols[7] || "").trim();
      const days = daysRaw === Util.EVERY_DAY_LABEL
        ? Util.AVAIL_DAYS.map((d) => d.key)
        : Util.AVAIL_DAYS.filter((d) => daysRaw.split(/[,\/\s]+/).map((x) => x.trim()).includes(d.label)).map((d) => d.key);
      rows.push({ name, gameId, normalPrice, discountPrice, timeSlots, days });
    });
    return rows;
  }

  // Applies List Streamer rows: matches streamers by name (creating new ones as needed), sets
  // price per row's game, and merges (unions) availability across all of a streamer's rows since
  // availability is stored per-streamer, not per-game. The sheet is treated as the source of
  // truth for price/availability, so it fully overwrites those fields (but never touches photo
  // or schedule data, and never touches streamers absent from this tab).
  function applyListStreamerRows(rows) {
    const nameToId = {};
    state.streamers.forEach((s) => { nameToId[s.name] = s.id; });
    let addedStreamers = 0;
    const availByName = {};
    rows.forEach((r) => {
      if (!nameToId[r.name]) {
        const created = addStreamer(r.name);
        nameToId[r.name] = created.id;
        addedStreamers++;
      }
      const sid = nameToId[r.name];
      setPrice(sid, r.gameId, r.normalPrice, r.discountPrice);
      if (!availByName[r.name]) availByName[r.name] = { timeSlots: new Set(), days: new Set() };
      r.timeSlots.forEach((t) => availByName[r.name].timeSlots.add(t));
      r.days.forEach((d) => availByName[r.name].days.add(d));
    });
    Object.keys(availByName).forEach((name) => {
      const sid = nameToId[name];
      updateStreamer(sid, {
        availability: {
          timeSlots: Array.from(availByName[name].timeSlots),
          days: Array.from(availByName[name].days),
        },
      });
    });
    save();
    return { addedStreamers, updatedCount: Object.keys(availByName).length };
  }

  // Fetches the List Streamer tab from the sheet and syncs price/availability into Admin data.
  async function syncStreamersFromSheet() {
    const res = await fetch(sheetCsvUrl(LIST_STREAMER_GID));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const rows = parseListStreamerCSV(text);
    if (!rows.length) throw new Error("ไม่พบข้อมูลใน tab List Streamer");
    return applyListStreamerRows(rows);
  }

  // Parses the sheet's raw CSV export into flat {date, time, gameId, streamerName, program} rows,
  // forward-filling the merged Date column the same way the original PowerShell importer did.
  function parseSheetCSV(csvText) {
    const lines = csvText.split(/\r\n|\n/).slice(2); // row1 is blank, row2 is the header row
    let currentDate = null;
    const rows = [];
    lines.forEach((line) => {
      if (line === "") return;
      const [dateRaw, time, game, program, kol] = splitCSVLine(line);
      const dateTrim = (dateRaw || "").trim();
      if (dateTrim) {
        const parts = dateTrim.split("/");
        if (parts.length === 3) {
          currentDate = `${parts[2]}-${parts[1].padStart(2, "0")}-${parts[0].padStart(2, "0")}`;
        }
      }
      if (!currentDate) return;
      const streamerName = (kol || "").trim();
      if (!streamerName) return;
      const gameId = mapSheetGameId(game);
      if (!gameId) return;
      rows.push({ date: currentDate, time: (time || "").trim(), gameId, streamerName, program: (program || "").trim() });
    });
    return rows;
  }

  function defaultState() {
    return { games: [], streamers: [], schedule: [], dayStatus: {}, setupRecords: [] };
  }

  async function load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = JSON.parse(raw);
      return state;
    }
    state = typeof SEED_DATA !== "undefined" ? JSON.parse(JSON.stringify(SEED_DATA)) : defaultState();
    save();
    return state;
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function get() {
    return state;
  }

  function uid(prefix) {
    return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ---------- Games ----------
  function listGames() {
    return state.games;
  }
  function getGame(id) {
    return state.games.find((g) => g.id === id);
  }
  function addGame(g) {
    const game = { id: uid("g"), name: g.name, fullName: g.fullName || g.name, color: g.color || "#64748b", youtubeUrl: g.youtubeUrl || null, channelId: g.channelId || null, brief: { text: "", startDate: null, endDate: null } };
    state.games.push(game);
    save();
    return game;
  }
  function updateGame(id, patch) {
    const g = getGame(id);
    if (!g) return;
    Object.assign(g, patch);
    save();
  }

  // ---------- Streamers ----------
  function listStreamers() {
    return state.streamers;
  }
  function getStreamer(id) {
    return state.streamers.find((s) => s.id === id);
  }
  function addStreamer(name) {
    const s = { id: uid("s"), name, photo: null, prices: [], availability: { timeSlots: [], days: [] } };
    state.streamers.push(s);
    save();
    return s;
  }
  function updateStreamer(id, patch) {
    const s = getStreamer(id);
    if (!s) return;
    Object.assign(s, patch);
    save();
  }
  function deleteStreamer(id) {
    state.streamers = state.streamers.filter((s) => s.id !== id);
    state.schedule = state.schedule.filter((e) => e.streamerId !== id);
    save();
  }

  // ---------- Prices (per streamer, per game) ----------
  function setPrice(streamerId, gameId, normalPrice, discountPrice) {
    const s = getStreamer(streamerId);
    if (!s) return;
    let p = s.prices.find((p) => p.gameId === gameId);
    if (!p) {
      p = { gameId, normalPrice: 0, discountPrice: null };
      s.prices.push(p);
    }
    p.normalPrice = normalPrice;
    p.discountPrice = discountPrice === "" || discountPrice === null || discountPrice === undefined ? null : discountPrice;
    save();
  }
  function deletePrice(streamerId, gameId) {
    const s = getStreamer(streamerId);
    if (!s) return;
    s.prices = s.prices.filter((p) => p.gameId !== gameId);
    save();
  }
  function getPrice(streamerId, gameId) {
    const s = getStreamer(streamerId);
    if (!s) return null;
    return s.prices.find((p) => p.gameId === gameId) || null;
  }
  // Effective price used for totals: discount price if set, otherwise normal price.
  function effectivePrice(streamerId, gameId) {
    const p = getPrice(streamerId, gameId);
    if (!p) return { normal: 0, actual: 0 };
    const normal = Number(p.normalPrice) || 0;
    const actual = p.discountPrice !== null && p.discountPrice !== undefined && p.discountPrice !== "" ? Number(p.discountPrice) : normal;
    return { normal, actual };
  }

  // ---------- Schedule ----------
  function listSchedule() {
    return state.schedule;
  }
  function listScheduleByDate(date) {
    return state.schedule.filter((e) => e.date === date);
  }
  function listScheduleByMonth(year, month) {
    const prefix = `${year}-${String(month).padStart(2, "0")}`;
    return state.schedule.filter((e) => e.date.startsWith(prefix));
  }
  function addScheduleEntry(entry) {
    const e = { id: uid("e"), date: entry.date, time: entry.time || "", gameId: entry.gameId, streamerId: entry.streamerId, program: entry.program || "", isTournament: !!entry.isTournament };
    state.schedule.push(e);
    save();
    return e;
  }
  function updateScheduleEntry(id, patch) {
    const e = state.schedule.find((e) => e.id === id);
    if (!e) return;
    Object.assign(e, patch);
    save();
  }
  function deleteScheduleEntry(id) {
    state.schedule = state.schedule.filter((e) => e.id !== id);
    save();
  }
  function setEntryTournament(id, isTournament) {
    const e = state.schedule.find((e) => e.id === id);
    if (!e) return;
    e.isTournament = isTournament;
    save();
  }

  // ---------- Day status: normal | no_live (whole day cancelled) ----------
  function getDayStatus(date) {
    return state.dayStatus[date] || "normal";
  }
  function setDayStatus(date, status) {
    if (status === "normal") {
      delete state.dayStatus[date];
    } else {
      state.dayStatus[date] = status;
    }
    save();
  }

  // Cost of a single schedule entry, accounting for day cancellation and per-entry tournament (free) status.
  function getEntryCost(entry) {
    if (getDayStatus(entry.date) === "no_live") {
      return { normal: 0, actual: 0, excluded: true, free: false };
    }
    if (entry.isTournament) {
      return { normal: 0, actual: 0, excluded: false, free: true };
    }
    const price = effectivePrice(entry.streamerId, entry.gameId);
    return { normal: price.normal, actual: price.actual, excluded: false, free: false };
  }

  // ---------- Import/Export ----------
  function exportJSON() {
    return JSON.stringify(state, null, 2);
  }
  function importJSON(json) {
    const parsed = JSON.parse(json);
    state = parsed;
    save();
  }
  function resetToSeed() {
    localStorage.removeItem(STORAGE_KEY);
    return load();
  }

  // Once a browser has saved data in localStorage, load() never looks at the bundled seed
  // again — so a device that first opened the app before a game's youtubeUrl/channelId was
  // set (or before it changed) is stuck with the old value forever. This pulls just those two
  // fields from the bundled seed into the existing games, without touching anything else
  // (streamers, schedule, prices, or any other admin edits stay exactly as they are).
  async function syncGamesFromSeed() {
    let seed;
    if (typeof SEED_DATA !== "undefined") {
      seed = SEED_DATA;
    } else {
      const res = await fetch("data/seed.json");
      seed = await res.json();
    }
    let updated = 0;
    seed.games.forEach((sg) => {
      const g = getGame(sg.id);
      if (g) {
        g.youtubeUrl = sg.youtubeUrl;
        g.channelId = sg.channelId;
      } else {
        state.games.push({ ...sg });
      }
      updated++;
    });
    save();
    return { updated };
  }

  // Same staleness problem as syncGamesFromSeed, but for streamer photos bulk-imported into
  // the bundled seed after a device's localStorage was already created. Only fills in a photo
  // for a streamer who currently has none — never overwrites a photo someone already set
  // (bundled default or a custom upload), and matches by name like the other sheet syncs.
  async function syncPhotosFromSeed() {
    let seed;
    if (typeof SEED_DATA !== "undefined") {
      seed = SEED_DATA;
    } else {
      const res = await fetch("data/seed.json");
      seed = await res.json();
    }
    const byName = {};
    seed.streamers.forEach((s) => { byName[s.name] = s; });
    let updated = 0;
    state.streamers.forEach((s) => {
      const seedS = byName[s.name];
      if (seedS && seedS.photo && !s.photo) {
        s.photo = seedS.photo;
        updated++;
      }
    });
    save();
    return { updated };
  }

  // Replaces the schedule with the given flat {date,time,gameId,streamerName,program} rows,
  // matching streamers by name so existing profiles (prices, photo, availability) are left untouched.
  // New streamer names are added; per-entry tournament (free) flags carry over when the same
  // date+time+game+streamer combination still exists in the new rows.
  function applyScheduleRows(rows) {
    const nameToId = {};
    state.streamers.forEach((s) => { nameToId[s.name] = s.id; });
    let addedStreamers = 0;
    const seenNames = new Set();
    rows.forEach((r) => {
      if (seenNames.has(r.streamerName)) return;
      seenNames.add(r.streamerName);
      if (!nameToId[r.streamerName]) {
        const created = addStreamer(r.streamerName);
        nameToId[r.streamerName] = created.id;
        addedStreamers++;
      }
    });

    const idToName = {};
    state.streamers.forEach((s) => { idToName[s.id] = s.name; });
    const oldTournamentKeys = new Set();
    state.schedule.forEach((e) => {
      if (!e.isTournament) return;
      const name = idToName[e.streamerId];
      if (!name) return;
      oldTournamentKeys.add(`${e.date}|${e.time}|${e.gameId}|${name}`);
    });

    state.schedule = rows.map((r) => {
      const key = `${r.date}|${r.time}|${r.gameId}|${r.streamerName}`;
      return {
        id: uid("e"),
        date: r.date,
        time: r.time,
        gameId: r.gameId,
        streamerId: nameToId[r.streamerName],
        program: r.program,
        isTournament: oldTournamentKeys.has(key),
      };
    });
    save();
    return { addedStreamers, newCount: state.schedule.length };
  }

  // Refreshes the schedule from the sheet snapshot embedded/bundled with this file (offline fallback).
  async function syncScheduleFromSeed() {
    let seed;
    if (typeof SEED_DATA !== "undefined") {
      seed = SEED_DATA;
    } else {
      const res = await fetch("data/seed.json");
      seed = await res.json();
    }
    const seedIdToName = {};
    seed.streamers.forEach((s) => { seedIdToName[s.id] = s.name; });
    const rows = seed.schedule.map((se) => ({
      date: se.date, time: se.time, gameId: se.gameId, streamerName: seedIdToName[se.streamerId], program: se.program,
    }));
    return applyScheduleRows(rows);
  }

  // Fetches every known month tab's CSV directly from Google Sheets (real-time) and refreshes
  // the schedule from the combined result. See SHEET_MONTH_TABS above to add new months.
  // A single tab failing (network error, or a tab whose sharing/protection settings block
  // anonymous export) doesn't abort the rest — its rows are just skipped and reported back.
  async function syncScheduleFromSheet() {
    const failedTabs = [];
    const results = await Promise.all(SHEET_MONTH_TABS.map(async (tab) => {
      try {
        const res = await fetch(sheetCsvUrl(tab.gid));
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const rows = parseSheetCSV(text);
        if (!rows.length) failedTabs.push(tab.name);
        return rows;
      } catch (err) {
        failedTabs.push(tab.name);
        return [];
      }
    }));
    const rows = results.flat();
    if (!rows.length) throw new Error("ไม่พบข้อมูลในชีทเลย (ทุกแท็บดึงไม่ได้)");
    const applied = applyScheduleRows(rows);
    return { ...applied, failedTabs };
  }

  return {
    load, save, get, uid,
    listGames, getGame, addGame, updateGame,
    listStreamers, getStreamer, addStreamer, updateStreamer, deleteStreamer,
    setPrice, deletePrice, getPrice, effectivePrice,
    listSchedule, listScheduleByDate, listScheduleByMonth, addScheduleEntry, updateScheduleEntry, deleteScheduleEntry, setEntryTournament,
    getDayStatus, setDayStatus, getEntryCost,
    exportJSON, importJSON, resetToSeed, syncScheduleFromSeed, syncScheduleFromSheet, syncStreamersFromSheet, syncGamesFromSeed, syncPhotosFromSeed, syncBriefsFromSheet,
    syncSetupFromSheet, listSetupRecords, setupGamesForStreamer,
  };
})();


// Client-side access gate for internal-only pages (Summary, Admin).
// Note: this is a soft deterrent, not real security — the credentials live in this
// public JS file, so anyone who reads the page source can see them.
const Auth = (() => {
  const KEY = "sm_auth_ok";
  const VALID_ID = "Critdamage";
  const VALID_PW = "CDM";

  function isAuthed() {
    return localStorage.getItem(KEY) === "1";
  }

  function logout() {
    localStorage.removeItem(KEY);
  }

  function renderLogin(container, onSuccess) {
    container.innerHTML = `
      <div class="card" style="max-width:340px;margin:60px auto 0;">
        <h2>เข้าสู่ระบบ</h2>
        <p style="color:var(--text-dim);font-size:13px;margin-bottom:16px;">หน้านี้เป็นข้อมูลภายใน กรุณาเข้าสู่ระบบก่อนใช้งาน</p>
        <div class="field" style="margin-bottom:10px;">
          <label>ID</label>
          <input id="auth-id" autocomplete="username" style="width:100%;">
        </div>
        <div class="field" style="margin-bottom:10px;">
          <label>Password</label>
          <input id="auth-pw" type="password" autocomplete="current-password" style="width:100%;">
        </div>
        <div id="auth-error" style="color:var(--danger);font-size:12px;margin-bottom:10px;display:none;">ID หรือรหัสผ่านไม่ถูกต้อง</div>
        <button id="auth-submit" style="width:100%;">เข้าสู่ระบบ</button>
      </div>
    `;
    const idInput = container.querySelector("#auth-id");
    const pwInput = container.querySelector("#auth-pw");
    const errorEl = container.querySelector("#auth-error");

    const submit = () => {
      if (idInput.value.trim() === VALID_ID && pwInput.value === VALID_PW) {
        localStorage.setItem(KEY, "1");
        onSuccess();
      } else {
        errorEl.style.display = "block";
      }
    };
    container.querySelector("#auth-submit").addEventListener("click", submit);
    [idInput, pwInput].forEach((el) => el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submit();
    }));
    idInput.focus();
  }

  return { isAuthed, logout, renderLogin };
})();


const Calendar = (() => {
  let state = { year: null, month: null, view: "month", weekAnchor: null, gameFilter: null };

  function init() {
    const today = new Date();
    if (!state.year) {
      state.year = today.getFullYear();
      state.month = today.getMonth() + 1;
      state.weekAnchor = Util.todayISO();
    }
  }

  function dayEntriesSorted(dateISO) {
    let entries = DB.listScheduleByDate(dateISO);
    if (state.gameFilter) entries = entries.filter((e) => e.gameId === state.gameFilter);
    return entries.sort((a, b) => a.time.localeCompare(b.time));
  }

  function gameBadges(dateISO) {
    const entries = dayEntriesSorted(dateISO);
    const byGame = {};
    entries.forEach((e) => {
      byGame[e.gameId] = (byGame[e.gameId] || 0) + 1;
    });
    return Object.keys(byGame).map((gid) => {
      const g = DB.getGame(gid);
      if (!g) return "";
      return `<span class="game-badge" style="background:${g.color}">${Util.escapeHtml(g.name)} ${byGame[gid]}</span>`;
    }).join("");
  }

  // When a single game is selected, list streamer names directly instead of a count badge.
  function streamerNameList(dateISO) {
    const entries = dayEntriesSorted(dateISO);
    if (!entries.length) return `<div class="cal-name-empty">—</div>`;
    return entries.map((e) => {
      const s = DB.getStreamer(e.streamerId);
      return `<div class="cal-name-item ${e.isTournament ? "tournament" : ""}">${e.isTournament ? "🏆 " : ""}${Util.escapeHtml(s ? s.name : "?")}</div>`;
    }).join("");
  }

  function renderLegend() {
    return `<div class="legend">
      <span><span class="status-swatch" style="background:rgba(239,68,68,0.35);border:1px solid var(--danger)"></span>ไม่ไลฟ์</span>
      <span><span class="status-swatch" style="background:rgba(184,134,11,0.35);border:1px solid var(--warning)"></span>🏆 มีทัวร์นาเมนต์ (ฟรี)</span>
    </div>`;
  }

  function renderGameFilter() {
    const games = DB.listGames();
    const allActive = !state.gameFilter;
    const chips = [`<button class="game-filter-chip ${allActive ? "active" : ""}" data-game-filter="">ทั้งหมด</button>`]
      .concat(games.map((g) => {
        const active = state.gameFilter === g.id;
        const style = active ? `background:${g.color};border-color:${g.color};color:#fff;` : `border-color:${g.color};color:${g.color};`;
        return `<button class="game-filter-chip" data-game-filter="${g.id}" style="${style}">${Util.escapeHtml(g.name)}</button>`;
      }));
    return `<div class="game-filter-row">${chips.join("")}</div>`;
  }

  function renderMonthGrid(year, month) {
    const firstDay = new Date(year, month - 1, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month, 0).getDate();
    const todayISO = Util.todayISO();

    let cells = "";
    for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateISO = Util.toISODate(year, month, d);
      const status = DB.getDayStatus(dateISO);
      const isToday = dateISO === todayISO ? "today" : "";
      const hasTournament = dayEntriesSorted(dateISO).some((e) => e.isTournament);
      cells += `<div class="cal-cell status-${status} ${isToday}" data-date="${dateISO}">
        <div class="date-num">${d}${status === "no_live" ? `<span class="status-tag no_live"> · ไม่ไลฟ์</span>` : hasTournament ? `<span class="status-tag tournament"> · 🏆</span>` : ""}</div>
        ${state.gameFilter
          ? `<div class="cal-names">${streamerNameList(dateISO)}</div>`
          : `<div class="badges">${gameBadges(dateISO)}</div>`}
      </div>`;
    }
    const dow = Util.DOW_TH.map((d) => `<div class="cal-dow">${d}</div>`).join("");
    return `<div class="cal-grid">${dow}${cells}</div>`;
  }

  function renderWeekGrid(anchorISO) {
    const anchor = Util.parseISODate(anchorISO);
    const startOfWeek = new Date(anchor);
    startOfWeek.setDate(anchor.getDate() - anchor.getDay());
    const todayISO = Util.todayISO();

    const weekDates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(startOfWeek);
      d.setDate(startOfWeek.getDate() + i);
      weekDates.push(d);
    }
    // If today falls in this week, lead with it (then continue forward, wrapping the earlier
    // days of the week to the end) so it's visible immediately without scrolling on mobile.
    const todayIdx = weekDates.findIndex((d) => Util.toISODate(d.getFullYear(), d.getMonth() + 1, d.getDate()) === todayISO);
    const orderedDates = todayIdx >= 0 ? [...weekDates.slice(todayIdx), ...weekDates.slice(0, todayIdx)] : weekDates;

    let cols = "";
    orderedDates.forEach((d) => {
      const dateISO = Util.toISODate(d.getFullYear(), d.getMonth() + 1, d.getDate());
      const status = DB.getDayStatus(dateISO);
      const entries = dayEntriesSorted(dateISO);
      const isToday = dateISO === todayISO ? "today" : "";

      const events = entries.length
        ? entries.map((e) => {
            const g = DB.getGame(e.gameId);
            const s = DB.getStreamer(e.streamerId);
            return `<div class="week-event" style="border-left-color:${g ? g.color : "#999"}">
              <div class="we-time">${Util.escapeHtml(e.time)}</div>
              <div class="we-game" style="color:${g ? g.color : "var(--text)"}">${g ? Util.escapeHtml(g.fullName) : "?"}</div>
              <div class="we-streamer">${Util.escapeHtml(s ? s.name : "ไม่ระบุ")}</div>
              ${e.isTournament ? `<div class="we-tournament-tag">🏆 ทัวร์นาเมนต์ฟรี</div>` : ""}
            </div>`;
          }).join("")
        : `<div class="empty-state" style="padding:14px 4px;">— ไม่มีคิว —</div>`;

      cols += `<div class="week-col status-${status} ${isToday}" data-date="${dateISO}">
        <div class="week-col-header">
          <span>${Util.DOW_TH[d.getDay()]} ${d.getDate()}</span>
          ${status === "no_live" ? `<span class="status-tag no_live">ไม่ไลฟ์</span>` : ""}
        </div>
        ${events}
      </div>`;
    });
    return `<div class="week-grid">${cols}</div>`;
  }

  function render(container) {
    init();
    const monthTitle = `${Util.MONTH_NAMES_TH[state.month - 1]} ${state.year + 543}`;
    container.innerHTML = `
      <div class="card">
        <div class="cal-header">
          <div class="row">
            <button class="secondary small" id="cal-prev">‹</button>
            <div class="cal-title">${state.view === "month" ? monthTitle : "รายสัปดาห์"}</div>
            <button class="secondary small" id="cal-next">›</button>
            <button class="secondary small" id="cal-today">วันนี้</button>
          </div>
          <div class="row" style="gap:8px;">
            <div class="view-toggle">
              <button data-view="month" class="${state.view === "month" ? "active" : ""}">รายเดือน</button>
              <button data-view="week" class="${state.view === "week" ? "active" : ""}">รายสัปดาห์</button>
            </div>
            <button class="secondary small" id="reload-schedule" title="ดึงตารางไลฟ์สดจาก Google Sheet ตอนนี้เลย (ต้องมีอินเทอร์เน็ต) — ราคา/รูป/ช่วงเวลาที่สะดวกของ Streamer จะไม่หาย">↻ โหลดตารางไลฟ์ล่าสุด</button>
          </div>
        </div>
        ${renderGameFilter()}
        ${renderLegend()}
        ${state.view === "month" ? renderMonthGrid(state.year, state.month) : renderWeekGrid(state.weekAnchor)}
      </div>
    `;

    container.querySelectorAll("[data-date]").forEach((el) => {
      el.addEventListener("click", () => openDayModal(el.getAttribute("data-date")));
    });
    container.querySelector("#cal-prev").addEventListener("click", () => shift(-1));
    container.querySelector("#cal-next").addEventListener("click", () => shift(1));
    container.querySelector("#cal-today").addEventListener("click", () => {
      const t = new Date();
      state.year = t.getFullYear();
      state.month = t.getMonth() + 1;
      state.weekAnchor = Util.todayISO();
      render(container);
    });
    container.querySelectorAll(".view-toggle button").forEach((b) => {
      b.addEventListener("click", () => {
        state.view = b.getAttribute("data-view");
        render(container);
      });
    });
    container.querySelectorAll(".game-filter-chip").forEach((b) => {
      b.addEventListener("click", () => {
        state.gameFilter = b.getAttribute("data-game-filter") || null;
        render(container);
      });
    });
    container.querySelector("#reload-schedule").addEventListener("click", async () => {
      if (!confirm("ดึงตารางไลฟ์ล่าสุดจาก Google Sheet สดๆ มาอัปเดต?\n\nจะอัปเดตวัน/เวลา/เกม/ผู้ไลฟ์ให้ตรงกับชีทล่าสุด ส่วนราคา รูปภาพ และช่วงเวลาที่สะดวกของ Streamer ที่ตั้งค่าไว้ในหลังบ้านจะไม่หาย")) return;
      Util.showToast("กำลังดึงข้อมูลจาก Google Sheet…");
      try {
        const result = await DB.syncScheduleFromSheet();
        render(container);
        const failedNote = result.failedTabs && result.failedTabs.length ? ` — ดึงไม่ได้: ${result.failedTabs.join(", ")}` : "";
        Util.showToast(`อัปเดตจากชีทสดแล้ว (${result.newCount} คิว${result.addedStreamers ? `, เพิ่ม Streamer ใหม่ ${result.addedStreamers} คน` : ""})${failedNote}`);
      } catch (liveErr) {
        try {
          const result = await DB.syncScheduleFromSeed();
          render(container);
          Util.showToast(`ดึงชีทสดไม่ได้ (${liveErr.message}) — ใช้ข้อมูลสำรองในไฟล์แทน (${result.newCount} คิว)`);
        } catch (fallbackErr) {
          Util.showToast("โหลดข้อมูลไม่สำเร็จ: " + fallbackErr.message);
        }
      }
    });
  }

  function shift(dir) {
    if (state.view === "month") {
      state.month += dir;
      if (state.month > 12) { state.month = 1; state.year++; }
      if (state.month < 1) { state.month = 12; state.year--; }
    } else {
      const d = Util.parseISODate(state.weekAnchor);
      d.setDate(d.getDate() + dir * 7);
      state.weekAnchor = Util.toISODate(d.getFullYear(), d.getMonth() + 1, d.getDate());
    }
    render(document.getElementById("app"));
  }

  function refreshBackground() {
    const app = document.getElementById("app");
    if (app) render(app);
  }

  // Compact "normal/discount price + available days & times" line shown under each session row,
  // so admin can see it at a glance without opening the Streamer detail page.
  function sessionSubInfo(s, gameId) {
    if (!s) return "";
    const p = DB.getPrice(s.id, gameId);
    const hasDiscount = p && p.discountPrice !== null && p.discountPrice !== undefined && p.discountPrice !== "";
    const priceText = !p
      ? "ยังไม่ตั้งราคา"
      : hasDiscount
      ? `ปกติ ฿${Util.fmtMoney(p.normalPrice)} → ลด ฿${Util.fmtMoney(p.discountPrice)}`
      : `ราคา ฿${Util.fmtMoney(p.normalPrice)}`;

    const avail = s.availability || { timeSlots: [], days: [] };
    const slotLabels = Util.TIME_SLOTS.filter((t) => avail.timeSlots.includes(t.key)).map((t) => t.label);
    const dayLabels = Util.AVAIL_DAYS.filter((d) => avail.days.includes(d.key)).map((d) => d.label);
    const availText = slotLabels.length || dayLabels.length
      ? `สะดวก: ${[...slotLabels, ...dayLabels].join(" ")}`
      : "ยังไม่ระบุเวลาสะดวก";

    return `<div class="session-row-sub"><span>${Util.escapeHtml(priceText)}</span><span>${Util.escapeHtml(availText)}</span></div>`;
  }

  function openDayModal(dateISO) {
    const d = Util.parseISODate(dateISO);
    const label = `${d.getDate()} ${Util.MONTH_NAMES_TH[d.getMonth()]} ${d.getFullYear() + 543}`;
    const status = DB.getDayStatus(dateISO);
    const entries = dayEntriesSorted(dateISO);

    let rows = entries.map((e) => {
      const g = DB.getGame(e.gameId);
      const s = DB.getStreamer(e.streamerId);
      const cost = DB.getEntryCost(e);
      return `<div class="session-row ${e.isTournament ? "is-tournament" : ""}">
        <div class="session-row-main">
          <span class="badge" style="background:${g ? g.color : "#666"}">${g ? Util.escapeHtml(g.name) : "?"}</span>
          <span class="time">${Util.escapeHtml(e.time)}</span>
          ${Util.avatarHTML(s, "tiny")}
          <a class="streamer-link" data-streamer="${s ? s.id : ""}">${Util.escapeHtml(s ? s.name : "ไม่ระบุ")}</a>
          <button class="tour-icon-toggle ${e.isTournament ? "active" : ""}" data-toggle-tournament="${e.id}" title="${e.isTournament ? "ยกเลิกทัวร์นาเมนต์ (คิดเงินตามปกติ)" : "ทำเครื่องหมายว่าคนนี้มาทัวร์นาเมนต์ฟรี"}">🏆</button>
          <span class="price ${cost.free ? "free" : ""}">${cost.free ? "ฟรี" : "฿" + Util.fmtMoney(cost.actual)}</span>
        </div>
        ${sessionSubInfo(s, e.gameId)}
      </div>`;
    }).join("");
    if (!entries.length) rows = `<div class="empty-state">ไม่มีคิวไลฟ์ในวันนี้</div>`;

    const statusBanner = status === "no_live"
      ? `<div class="row" style="color:var(--danger);font-weight:700;margin-bottom:10px;">🔴 วันนี้ไม่มีการไลฟ์ — ไม่นำมารวมยอด</div>`
      : "";

    Util.openModal(`
      <div class="row between"><h2>${label}</h2><button class="modal-close" id="modal-close-btn">✕</button></div>
      ${statusBanner}
      <div class="row" style="margin-bottom:12px;">
        <button class="${status === "no_live" ? "secondary" : "danger"} small" id="toggle-no-live">
          ${status === "no_live" ? "↩ ยกเลิกสถานะไม่ไลฟ์" : "🔴 ทำเครื่องหมายว่าวันนี้ไม่ไลฟ์"}
        </button>
      </div>
      ${rows}
    `);
    document.getElementById("modal-close-btn").addEventListener("click", Util.closeModal);
    document.querySelectorAll("[data-streamer]").forEach((el) => {
      const id = el.getAttribute("data-streamer");
      if (!id) return;
      el.addEventListener("click", () => {
        Util.closeModal();
        location.hash = `#streamer/${id}`;
      });
    });
    document.getElementById("toggle-no-live").addEventListener("click", () => {
      DB.setDayStatus(dateISO, status === "no_live" ? "normal" : "no_live");
      refreshBackground();
      openDayModal(dateISO);
    });
    document.querySelectorAll("[data-toggle-tournament]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const entryId = btn.getAttribute("data-toggle-tournament");
        const entry = DB.listSchedule().find((e) => e.id === entryId);
        DB.setEntryTournament(entryId, !entry.isTournament);
        refreshBackground();
        openDayModal(dateISO);
      });
    });
  }

  return { render };
})();


// "Who's live right now" board — a lightweight card grid (avatar + pulsing LIVE dot + game
// badge) instead of heavy embedded video players. Live/offline status per game comes from the
// schedule data we already have (is there an entry for this game whose time window covers now),
// so it needs no API key and no per-streamer channel setup. Clicking a live card opens that
// game's YouTube channel so you can actually watch.
const LiveStream = (() => {
  function nowMinutesBangkok() {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Bangkok", hour: "2-digit", minute: "2-digit", hour12: false,
    }).formatToParts(new Date());
    const h = Number(parts.find((p) => p.type === "hour").value);
    const m = Number(parts.find((p) => p.type === "minute").value);
    return h * 60 + m;
  }

  function parseTimeRange(rangeStr) {
    const parts = (rangeStr || "").split("-").map((s) => s.trim());
    if (parts.length !== 2) return null;
    const toMin = (t) => {
      const m = t.match(/^(\d{1,2})\.(\d{2})$/);
      if (!m) return null;
      return Number(m[1]) * 60 + Number(m[2]);
    };
    const start = toMin(parts[0]);
    const end = toMin(parts[1]);
    if (start === null || end === null) return null;
    return { start, end };
  }

  function isRangeActive(range, nowMin) {
    if (range.end >= range.start) return nowMin >= range.start && nowMin < range.end;
    return nowMin >= range.start || nowMin < range.end; // wraps past midnight
  }

  // For a game: finds the entry currently in its scheduled window today (if any),
  // and the next upcoming one today (for the "not live yet" caption).
  function gameScheduleStatus(gameId) {
    const nowMin = nowMinutesBangkok();
    const todayEntries = DB.listScheduleByDate(Util.todayISO())
      .filter((e) => e.gameId === gameId)
      .sort((a, b) => a.time.localeCompare(b.time));

    let current = null;
    let next = null;
    todayEntries.forEach((e) => {
      const range = parseTimeRange(e.time);
      if (!range) return;
      if (!current && isRangeActive(range, nowMin)) current = e;
      if (!next && range.start > nowMin) next = e;
    });
    return { current, next };
  }

  function gameBadgeInitials(name) {
    return (name || "?").replace(/[^A-Za-z0-9ก-๙]/g, "").slice(0, 2).toUpperCase();
  }

  function renderCard(g) {
    const status = gameScheduleStatus(g.id);
    const isLive = !!status.current;
    const entry = status.current || status.next;
    const s = entry ? DB.getStreamer(entry.streamerId) : null;

    const avatarHtml = s ? Util.avatarHTML(s, "") : `<div class="avatar-circle">${Util.escapeHtml(gameBadgeInitials(g.name))}</div>`;
    const name = s ? s.name : g.fullName;
    const statusLine = isLive
      ? `<span class="live-card-status is-live"><span class="live-dot-inline"></span> LIVE</span>`
      : status.next
        ? `<span class="live-card-status is-offline">รอบถัดไป ${Util.escapeHtml(status.next.time)}</span>`
        : `<span class="live-card-status is-offline">ไม่มีคิววันนี้แล้ว</span>`;

    const tag = g.youtubeUrl
      ? `<a href="${Util.escapeHtml(g.youtubeUrl)}" target="_blank" rel="noopener" class="live-card ${isLive ? "is-live" : "is-offline"}">`
      : `<div class="live-card ${isLive ? "is-live" : "is-offline"}">`;
    const closeTag = g.youtubeUrl ? "</a>" : "</div>";

    return `${tag}
      <div class="live-card-avatar-wrap">
        ${avatarHtml}
        ${isLive ? `<span class="live-pulse-dot"></span>` : ""}
        <span class="live-game-badge" style="background:${g.color};">${Util.escapeHtml(gameBadgeInitials(g.name))}</span>
      </div>
      <div class="live-card-name">${Util.escapeHtml(name)}</div>
      ${statusLine}
    ${closeTag}`;
  }

  // Order the Brief boxes exactly as requested: TalesRunner, WarZ, TOSM, Zone4, Cabal —
  // rather than whatever order DB.listGames() happens to return.
  const BRIEF_ORDER = ["tr", "warz", "tosm", "zone4", "cabal"];

  function formatBriefDate(iso) {
    if (!iso) return null;
    const d = Util.parseISODate(iso);
    return `${d.getDate()} ${Util.MONTH_NAMES_TH[d.getMonth()]} ${d.getFullYear() + 543}`;
  }

  function renderBriefBox(g) {
    const brief = g.brief || {};
    const hasText = brief.text && brief.text.trim();
    const startLabel = formatBriefDate(brief.startDate);
    const endLabel = formatBriefDate(brief.endDate);
    let dateLine = "";
    if (startLabel && endLabel) dateLine = `${startLabel} – ${endLabel}`;
    else if (startLabel) dateLine = `ตั้งแต่ ${startLabel}`;
    else if (endLabel) dateLine = `ถึง ${endLabel}`;
    return `<div class="brief-box" style="border-top-color:${g.color};">
      <div class="brief-game-name" style="color:${g.color};">${Util.escapeHtml(g.name)}</div>
      ${hasText ? `<div class="brief-text">${Util.linkify(Util.escapeHtml(brief.text))}</div>` : `<div class="brief-empty">ยังไม่มีบรีฟ</div>`}
      ${dateLine ? `<div class="brief-dates">📅 ${Util.escapeHtml(dateLine)}</div>` : ""}
    </div>`;
  }

  function render(container, opts) {
    opts = opts || {};
    const allGames = DB.listGames();
    const withChannel = allGames.filter((g) => g.channelId);
    const missing = allGames.filter((g) => !g.channelId);

    const cards = withChannel
      .map((g) => ({ g, isLive: !!gameScheduleStatus(g.id).current }))
      .sort((a, b) => (b.isLive - a.isLive))
      .map(({ g }) => renderCard(g))
      .join("");

    const orderedForBrief = BRIEF_ORDER.map((id) => DB.getGame(id)).filter(Boolean);
    allGames.forEach((g) => { if (!orderedForBrief.includes(g)) orderedForBrief.push(g); });

      ${withChannel.length ? `<div class="card"><div class="live-card-grid">${cards}</div></div>` : `<div class="card empty-state">ยังไม่ได้ตั้ง Channel ID ให้เกมไหนเลย — ไปตั้งได้ที่หลังบ้าน &gt; เกม</div>`}
      ${missing.length ? `<div class="card">
        <p style="color:var(--text-dim);font-size:12px;margin-bottom:10px;">ยังไม่ได้ตั้ง Channel ID: ${missing.map((g) => Util.escapeHtml(g.name)).join(", ")} — ไปตั้งได้ที่หลังบ้าน &gt; เกม หรือลองซิงค์ค่าเริ่มต้นก่อน</p>
        <button class="secondary small" id="live-sync-games">↻ ซิงค์ Channel ID เริ่มต้น</button>
      </div>` : ""}
    `;

    container.querySelector("#live-refresh-all").addEventListener("click", () => {
      render(container);
      Util.showToast("รีเฟรชแล้ว");
    });
    const syncBtn = container.querySelector("#live-sync-games");
    if (syncBtn) syncBtn.addEventListener("click", async () => {
      syncBtn.disabled = true;
      syncBtn.textContent = "กำลังซิงค์...";
      try {
        await DB.syncGamesFromSeed();
        render(container);
        Util.showToast("ซิงค์ Channel ID แล้ว");
      } catch (err) {
        syncBtn.disabled = false;
        syncBtn.textContent = "↻ ซิงค์ Channel ID เริ่มต้น";
        Util.showToast("ซิงค์ไม่สำเร็จ: " + err.message);
      }
    });

    // Silently pull the latest Brief text from the sheet in the background so anyone viewing
    // this public page — not just the admin who clicked a sync button — sees an up-to-date
    // Brief without needing to refresh manually. Only re-renders if the content actually
    // changed, and never bothers a random visitor with a sync-failure toast.
    if (!opts.skipAutoSync) {
      const beforeSnapshot = JSON.stringify(DB.listGames().map((g) => g.brief));
      DB.syncBriefsFromSheet().then(() => {
        const afterSnapshot = JSON.stringify(DB.listGames().map((g) => g.brief));
        if (afterSnapshot !== beforeSnapshot) render(container, { skipAutoSync: true });
      }).catch(() => {
        // Some in-app browsers (e.g. the Google app's built-in browser) block background
        // fetches to other Google services like Sheets, even though Safari/Chrome don't — a
        // silent toast would leave visitors staring at possibly-stale data with no clue why.
        const warn = document.createElement("div");
        warn.className = "card";
        warn.style.border = "2px solid var(--warning)";
        warn.innerHTML = `<p style="color:var(--warning);font-size:13px;margin:0;">⚠️ โหลดข้อมูลล่าสุดจากชีทไม่ได้ อาจเป็นเพราะเปิดผ่านเบราว์เซอร์ในแอป (เช่น แอป Google) — ลองเปิดผ่าน Safari หรือ Chrome โดยตรงแทน</p>`;
        container.prepend(warn);
      });
    }
  }

  return { render };
})();


// Public "Setup Queue" page — no login needed, so anyone on the team can check it. Shows a
// prominent "today" reminder (Thailand time) plus the full history synced from the
// "ตาราง Set Up" sheet tab.
const SetupQueue = (() => {
  let state = { search: "" };

  const THAI_MONTHS = {
    "ม.ค.": 0, "ก.พ.": 1, "มี.ค.": 2, "เม.ย.": 3, "พ.ค.": 4, "มิ.ย.": 5,
    "ก.ค.": 6, "ส.ค.": 7, "ก.ย.": 8, "ต.ค.": 9, "พ.ย.": 10, "ธ.ค.": 11,
  };

  // The sheet's date columns are free text, staff-typed in a couple of different formats over
  // time: "D MMM YYYY" (Thai abbreviated month, e.g. "12 ก.ค. 2026") and "DD/MM/YYYY" (e.g.
  // "28/02/2026"). Older "วันที่ N" (day-only, no month) rows can't be safely resolved and are
  // treated as unparseable.
  function parseSetupDate(dateRaw) {
    const s = (dateRaw || "").trim();
    if (!s) return null;
    let m = s.match(/^(\d{1,2})\s+([ก-๙.]+)\s+(\d{4})$/);
    if (m) {
      const monthIdx = THAI_MONTHS[m[2]];
      if (monthIdx !== undefined) return Util.toISODate(Number(m[3]), monthIdx + 1, Number(m[1]));
    }
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return Util.toISODate(Number(m[3]), Number(m[2]), Number(m[1]));
    return null;
  }

  function gameBadgeColor(text) {
    const t = (text || "").toLowerCase();
    const match = DB.listGames().find((g) => t.includes(g.name.toLowerCase()) || g.name.toLowerCase().includes(t));
    return match ? match.color : "#94a3b8";
  }

  function formatThaiDate(iso) {
    if (!iso) return null;
    const d = Util.parseISODate(iso);
    return `${d.getDate()} ${Util.MONTH_NAMES_TH[d.getMonth()]} ${d.getFullYear() + 543}`;
  }

  // Compares the Set date against the Live date staff filled into the sheet's "วันไลฟ์" column
  // and renders a line showing both, plus a status so it's obvious at a glance whether the
  // "≥1 day before (or ≥1hr if same day)" rule was actually met.
  function renderSetupVsLiveLine(game, setupRec) {
    const color = gameBadgeColor(game);
    const setupISO = parseSetupDate(setupRec.dateRaw);
    const liveISO = parseSetupDate(setupRec.liveDateRaw);
    const setupLabel = setupISO ? formatThaiDate(setupISO) : Util.escapeHtml(setupRec.dateRaw || "?");

    let statusHtml;
    if (!setupRec.liveDateRaw) {
      statusHtml = `<span style="color:var(--text-dim);">ยังไม่ระบุวันไลฟ์</span>`;
    } else if (!liveISO || !setupISO) {
      statusHtml = `<span style="color:var(--text-dim);">Live ${Util.escapeHtml(setupRec.liveDateRaw)} (แปลงวันที่ไม่ได้)</span>`;
    } else {
      const dayDiff = Math.round((Util.parseISODate(liveISO) - Util.parseISODate(setupISO)) / 86400000);
      if (dayDiff >= 1) {
        statusHtml = `<span style="color:var(--success);">✅ Live ${formatThaiDate(liveISO)} (ก่อน ${dayDiff} วัน)</span>`;
      } else if (dayDiff === 0) {
        statusHtml = `<span style="color:var(--warning);">⚠️ Live ${formatThaiDate(liveISO)} (วันเดียวกัน — เช็คเวลาด้วยตัวเอง)</span>`;
      } else {
        statusHtml = `<span style="color:var(--danger);">⚠️ Live ${formatThaiDate(liveISO)} (Set หลังวันไลฟ์!)</span>`;
      }
    }
    return `<div style="margin-bottom:4px;"><span class="badge" style="background:${color};">${Util.escapeHtml(game)}</span> <span style="font-size:11px;">Set ${Util.escapeHtml(setupLabel)}${setupRec.time ? " " + Util.escapeHtml(setupRec.time) : ""} → ${statusHtml}</span></div>`;
  }

  function render(container, opts) {
    opts = opts || {};
    const records = DB.listSetupRecords();
    const today = Util.todayISO();
    const todayRecords = records.filter((r) => parseSetupDate(r.dateRaw) === today);

    const searchLower = state.search.trim().toLowerCase();
    const grouped = {};
    const lastSeenIndex = {};
    records.forEach((r, i) => {
      if (searchLower && !r.streamerName.toLowerCase().includes(searchLower)) return;
      if (!grouped[r.streamerName]) grouped[r.streamerName] = [];
      grouped[r.streamerName].push(r);
      lastSeenIndex[r.streamerName] = i; // sheet row order — later index = added more recently
    });
    // Newest-added streamers first, so recently-booked names are easy to spot at the top.
    const names = Object.keys(grouped).sort((a, b) => lastSeenIndex[b] - lastSeenIndex[a]);

    container.innerHTML = `
      <div class="card" style="border:2px solid ${todayRecords.some((r) => !r.done) ? "var(--danger)" : "var(--border)"};">
        <h2>📅 วันนี้ต้อง Set Up (${todayRecords.length})</h2>
        ${todayRecords.length ? `<div class="row" style="flex-wrap:wrap;gap:8px;margin-top:8px;">
          ${todayRecords.map((r) => `<span class="badge" style="background:${r.done ? "var(--success)" : "var(--danger)"};padding:6px 12px;font-size:13px;">
            ${r.done ? "✅" : "⏳"} ${Util.escapeHtml(r.streamerName)} — ${Util.escapeHtml(r.game)}${r.time ? " เวลา " + Util.escapeHtml(r.time) : ""}
          </span>`).join("")}
        </div>` : `<p style="color:var(--text-dim);font-size:13px;margin-top:4px;">วันนี้ไม่มีคิวนัด Set Up</p>`}
      </div>

      <div class="card">
        <div class="row between">
          <h2>คิวนัด Set Up (${records.length} รายการ, ${names.length}${searchLower ? "" : " คน"})</h2>
          <button class="secondary small" id="sync-setup-sheet">↻ ซิงค์จากชีท</button>
        </div>
        <div class="brief-box" style="margin-top:10px;">
          <strong>แนวทางนัด Set up:</strong>
          <ul style="margin:8px 0 0 18px;font-size:13px;line-height:1.7;">
            <li>นัดล่วงหน้าอย่างน้อย 1 วันก่อนวันไลฟ์จริง หรือถ้าหาวันไม่ได้ อย่างน้อย 1 ชม. ก่อนขึ้นไลฟ์</li>
            <li>เวลาแนะนำ: 13:00-13:30, 14:30-15:00, 15:00-15:30, 15:30-16:00, 17:00-17:30, 17:30-18:00, 21:30-22:00</li>
            <li>หลัง 22:00 (สี่ทุ่ม) ได้ถ้าจำเป็น</li>
          </ul>
        </div>
        <input type="text" id="setup-search" placeholder="ค้นหาชื่อ Streamer..." value="${Util.escapeHtml(state.search)}" style="width:100%;margin:12px 0;">
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Streamer</th><th>เกมที่ Set แล้ว</th><th>เกมที่รอ Set — วันเวลาที่ Set vs วันที่ Live</th></tr></thead>
          <tbody>
            ${names.length === 0 ? `<tr><td colspan="3"><div class="empty-state">ไม่พบข้อมูล — ลองกดซิงค์จากชีท</div></td></tr>` : ""}
            ${names.map((name) => {
              const recs = grouped[name];
              const doneRecByGame = {};
              recs.filter((r) => r.done).forEach((r) => { doneRecByGame[r.game] = r; }); // last one wins = most recent
              const doneGameNames = Object.keys(doneRecByGame);
              const pendingRecs = recs.filter((r) => !r.done);
              return `<tr>
                <td style="white-space:nowrap;">${Util.escapeHtml(name)}</td>
                <td style="font-size:12px;">
                  ${doneGameNames.length ? doneGameNames.map((g) => `<span class="badge" style="background:${gameBadgeColor(g)};margin-right:4px;margin-bottom:4px;display:inline-block;">${Util.escapeHtml(g)}</span>`).join("") : `<span style="color:var(--text-dim);">ไม่มี</span>`}
                </td>
                <td>${pendingRecs.length ? pendingRecs.map((r) => renderSetupVsLiveLine(r.game, r)).join("") : `<span style="color:var(--text-dim);font-size:12px;">—</span>`}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
        </div>
      </div>
    `;

    container.querySelector("#setup-search").addEventListener("input", (e) => {
      state.search = e.target.value;
      const cursorPos = e.target.selectionStart;
      render(container, { skipAutoSync: true });
      const newInput = container.querySelector("#setup-search");
      if (newInput) { newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
    });
    const syncBtn = container.querySelector("#sync-setup-sheet");
    syncBtn.addEventListener("click", async () => {
      syncBtn.disabled = true;
      syncBtn.textContent = "กำลังซิงค์...";
      try {
        const result = await DB.syncSetupFromSheet();
        render(container, { skipAutoSync: true });
        Util.showToast(`ซิงค์แล้ว — ${result.count} รายการ`);
      } catch (err) {
        syncBtn.disabled = false;
        syncBtn.textContent = "↻ ซิงค์จากชีท";
        Util.showToast("ซิงค์ไม่สำเร็จ: " + err.message);
      }
    });

    // Silently refresh from the sheet in the background so this stays a reliable "don't
    // forget" reminder for anyone who has the page open, without needing a manual click.
    if (!opts.skipAutoSync) {
      const before = JSON.stringify(DB.listSetupRecords());
      DB.syncSetupFromSheet().then(() => {
        const after = JSON.stringify(DB.listSetupRecords());
        if (after !== before) render(container, { skipAutoSync: true });
      }).catch(() => {
        // Some in-app browsers (e.g. the Google app's built-in browser) block background
        // fetches to other Google services like Sheets, even though Safari/Chrome don't — this
        // page is specifically a "don't forget" reminder, so silently going stale is the worst
        // failure mode; show a visible hint instead.
        const warn = document.createElement("div");
        warn.className = "card";
        warn.style.border = "2px solid var(--warning)";
        warn.innerHTML = `<p style="color:var(--warning);font-size:13px;margin:0;">⚠️ โหลดข้อมูลล่าสุดจากชีทไม่ได้ อาจเป็นเพราะเปิดผ่านเบราว์เซอร์ในแอป (เช่น แอป Google) — ลองเปิดผ่าน Safari หรือ Chrome โดยตรงแทน</p>`;
        container.prepend(warn);
      });
    }
  }

  return { render };
})();
